name: Validate Guide Sources

on:
  pull_request:
  push:
    branches:
      - main
      - work

jobs:
  validate:
    name: Install, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Artifact gate
        run: npm run check:artifacts

      - name: Runtime contract
        run: npm run contract

      - name: Unit tests
        run: npm test

      - name: Next production build
        run: npm run build
